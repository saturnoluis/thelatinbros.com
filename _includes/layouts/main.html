<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="robots" content="noindex, nofollow" />
        
        <!-- Primary Meta Tags -->
        <title>{{ title }}</title>
        <meta name="title" content="The Latin Bros - Authentic Latin Street Food in London" />
        <meta name="description" content="Fresh, vibrant Latin flavors in London. Famous for our handmade Cubanos, tacos & burritos. Find us at Maltby Street Market (Bermondsey) & Greenwich Market. Vegan & veggie options available." />
        <meta name="keywords" content="Latin street food, Cubanos, tacos, burritos, London food market, Maltby Street Market, Greenwich Market, vegan options, street food London" />
        
        <!-- Open Graph / Facebook -->
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://thelatinbros.com/" />
        <meta property="og:title" content="The Latin Bros - Authentic Latin Street Food in London" />
        <meta property="og:description" content="Fresh, vibrant Latin flavors in London. Famous for our handmade Cubanos, tacos & burritos. Find us at Maltby Street Market & Greenwich Market." />
        <meta property="og:site_name" content="The Latin Bros" />
        
        <!-- Twitter -->
        <meta property="twitter:card" content="summary_large_image" />
        <meta property="twitter:url" content="https://thelatinbros.com/" />
        <meta property="twitter:title" content="The Latin Bros - Authentic Latin Street Food in London" />
        <meta property="twitter:description" content="Fresh, vibrant Latin flavors in London. Famous for our handmade Cubanos, tacos & burritos. Find us at Maltby Street Market & Greenwich Market." />

        <!-- Styles -->
        <link rel="stylesheet" href="/css/main.css" />
    </head>

	<body>
		<main class="main--wrapper">
			<header class="header">
				<div class="header__logo--wrapper">
					<a href="/" rel="home" aria-label="Go to homepage">
						<img class="header__logo" src="images/thelatinbros__logo.opti.webp" alt="The Latin Bros Logo" width="200" height="60">
					</a>
					<p class="header__slogan">Latin Fusion Street Food</p>
				</div>
			</header>
			<div class="content--wrapper">
				{{ content }}
			</div>
		</main>
	</body>
</html>
